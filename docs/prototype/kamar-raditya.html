<style>
/* Layout: one full-bleed 3D room (Benteng Senja) with a thin HUD; content opens in a Material 3 side sheet (bottom sheet on phones). Flat palette, no gradients, single dark world. */
:root {
  /* palette: flat colors only */
  --obsidian: #15131A; --ash: #1E1B23; --stone: #3B3733; --olive: #4F5D3A; --silver: #E8E4DA; --gold: #C9A24A; --violet: #7B5EA7; --crimson: #A3312F;
  /* Material 3 color roles mapped onto the palette */
  --md-primary: var(--gold); --md-on-primary: #1E1606;
  --md-secondary-container: var(--olive); --md-on-secondary-container: var(--silver);
  --md-tertiary-container: #3E3157; --md-on-tertiary-container: #E3D6F5;
  --md-error-container: #4A1A19; --md-on-error-container: #F6CFCB;
  --md-surface: var(--obsidian); --md-surface-container-low: var(--ash); --md-surface-container: #24212A; --md-surface-container-high: #2C2832; --md-surface-container-highest: #36313D;
  --md-on-surface: var(--silver); --md-on-surface-variant: #B8B1A6; --md-outline: #7A746C; --md-outline-variant: #3C3842; --md-scrim: #000;
  --font: "Roboto Flex", "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Roboto Mono", ui-monospace, Menlo, monospace;
  --shape-xs: 4px; --shape-sm: 8px; --shape-md: 12px; --shape-lg: 16px; --shape-xl: 28px; --shape-full: 999px;
  --ease: cubic-bezier(0.2, 0, 0, 1); --ease-decel: cubic-bezier(0.05, 0.7, 0.1, 1);
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--obsidian); color: var(--md-on-surface); font-family: var(--font); -webkit-font-smoothing: antialiased; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* M3 type scale */
.headline-small { font-size: 24px; line-height: 32px; font-weight: 400; margin: 0; text-wrap: balance; }
.title-medium { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .15px; margin: 0; }
.title-small { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; margin: 0; }
.body-large { font-size: 16px; line-height: 24px; letter-spacing: .5px; margin: 0; }
.body-medium { font-size: 14px; line-height: 20px; letter-spacing: .25px; margin: 0; }
.label-large { font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .1px; }
.label-medium { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: .5px; }
.muted { color: var(--md-on-surface-variant); }

/* state layer */
.sl { position: relative; overflow: hidden; isolation: isolate; }
.sl::before { content: ""; position: absolute; inset: 0; background: currentColor; opacity: 0; transition: opacity 200ms var(--ease); z-index: -1; pointer-events: none; }
.sl:hover::before { opacity: .08; }
.sl:focus-visible::before, .sl:active::before { opacity: .12; }
:focus-visible { outline: 2px solid var(--md-primary); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 24px; border-radius: var(--shape-full); border: 0; cursor: pointer; font: 500 14px/20px var(--font); letter-spacing: .1px; text-decoration: none; white-space: nowrap; }
.btn svg { width: 18px; height: 18px; }
.btn.filled { background: var(--md-primary); color: var(--md-on-primary); }
.btn.tonal { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
.btn.text { background: transparent; color: var(--md-primary); padding: 0 12px; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--md-on-surface-variant); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 24px; height: 24px; }
svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: var(--shape-sm); border: 1px solid var(--md-outline-variant); color: var(--md-on-surface-variant); font: 500 13.5px/20px var(--font); letter-spacing: .1px; }
.chip.mono { font-family: var(--mono); font-size: 12.5px; }
.badge { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: var(--shape-sm); font: 500 12px/16px var(--font); letter-spacing: .5px; background: var(--md-tertiary-container); color: var(--md-on-tertiary-container); }
.badge.done { background: var(--md-surface-container-highest); color: var(--md-on-surface-variant); }
.badge.gold { background: var(--md-primary); color: var(--md-on-primary); }

.stack { display: grid; gap: 12px; }
.card { background: var(--md-surface-container); border: 1px solid var(--md-outline-variant); border-radius: var(--shape-md); padding: 16px; display: grid; gap: 10px; min-width: 0; }
.card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.card-actions { display: flex; gap: 4px; margin-left: -12px; flex-wrap: wrap; }
.list { display: grid; }
.li { display: flex; align-items: center; gap: 16px; min-height: 56px; padding: 10px 0; border-top: 1px solid var(--md-outline-variant); }
.li:first-child { border-top: 0; }
.li .lead { width: 40px; height: 40px; border-radius: 50%; background: var(--md-secondary-container); color: var(--md-on-secondary-container); display: grid; place-items: center; flex: none; }
.li .lead svg { width: 20px; height: 20px; }
.li .lead.text { font: 500 11.5px/14px var(--mono); text-align: center; }
.li .txt { flex: 1; min-width: 0; display: grid; gap: 2px; }
.li code { font: 500 13px/20px var(--mono); color: var(--md-on-surface); user-select: all; overflow-wrap: anywhere; }
.group { display: grid; gap: 10px; }
.cert { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 0; border-top: 1px solid var(--md-outline-variant); }
.cert:first-of-type { border-top: 0; }
.cert .hrs { font: 500 12px/20px var(--mono); color: var(--md-primary); }
.cert p { grid-column: 1 / -1; }

/* HUD */
.hud { position: fixed; z-index: 6; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding-top: calc(env(safe-area-inset-top, 0px) + 14px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.hud > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand .logo { width: 44px; height: 44px; flex: none; border-radius: var(--shape-md); background: var(--md-primary); display: grid; place-items: center; }
.brand .logo svg { width: 34px; height: 34px; }
.sigwrap { display: grid; }
#sig { width: 190px; height: 74px; display: block; margin: -10px 0 -2px -6px; }
#sig path { fill: none; stroke: var(--silver); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.actions { display: flex; align-items: center; gap: 12px; }
.clock-btn { font: 500 12px/16px var(--mono); color: var(--md-on-surface-variant); white-space: nowrap; height: 32px; padding: 0 12px; border-radius: var(--shape-sm); border: 1px solid var(--md-outline-variant); background: var(--md-surface-container-high); cursor: pointer; display: inline-flex; align-items: center; }
.clock-btn b { color: var(--md-primary); font-weight: 500; }
.clock-btn .ph { color: var(--md-on-surface); }

.hotspot { position: fixed; left: 0; top: 0; z-index: 4; display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px 0 10px; border-radius: var(--shape-sm); border: 1px solid var(--md-outline-variant); cursor: pointer;
  background: var(--md-surface-container-high); color: var(--md-on-surface); font: 500 13px/18px var(--font); letter-spacing: .1px; white-space: nowrap; transition: opacity .25s var(--ease), background .2s; opacity: 0; }
.hotspot.ready { opacity: 1; }
.hotspot .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--md-primary); position: relative; }
.hotspot .dot::after { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 1.5px solid var(--md-primary); animation: ping 1.8s ease-out infinite; }
.hotspot.is-hot { background: var(--md-primary); color: var(--md-on-primary); border-color: var(--md-primary); }
.hotspot.is-hot .dot { background: var(--md-on-primary); }
.bubble { position: fixed; left: 0; top: 0; z-index: 4; padding: 6px 10px; border-radius: 12px 12px 12px 4px; background: var(--md-surface-container-high); border: 1px solid var(--md-outline-variant); color: var(--md-on-surface); font: 500 12px/16px var(--font); letter-spacing: .3px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .3s var(--ease); }
.bubble.on { opacity: 1; }
.toast { position: fixed; z-index: 7; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translate(-50%, 160%); max-width: calc(100% - 32px); background: var(--silver); color: var(--obsidian); font: 500 14px/20px var(--font); letter-spacing: .25px; padding: 14px 16px; border-radius: var(--shape-xs); transition: transform .45s var(--ease-decel); pointer-events: none; }
.toast.on { transform: translate(-50%, 0); }
@keyframes ping { from { transform: scale(.6); opacity: .9 } to { transform: scale(1.9); opacity: 0 } }
.hint { position: fixed; z-index: 5; left: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); pointer-events: none; transition: opacity .3s; }

/* sheet */
.sheet { position: fixed; z-index: 8; top: 0; right: 0; bottom: 0; width: min(420px, 100%); display: flex; flex-direction: column; background: var(--md-surface-container-low); border-left: 1px solid var(--md-outline-variant);
  border-radius: var(--shape-lg) 0 0 var(--shape-lg); transform: translateX(110%); transition: transform .5s var(--ease-decel); visibility: hidden; padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet.open { transform: none; visibility: visible; }
.sheet .handle { display: none; width: 32px; height: 4px; border-radius: 2px; background: var(--md-outline); margin: 12px auto 4px; flex: none; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 12px 0 24px; flex: none; }
.sheet-body { overflow-y: auto; padding: 8px 24px 32px; display: grid; gap: 16px; align-content: start; }

.fallback { position: fixed; inset: 0; z-index: 20; overflow-y: auto; background: var(--obsidian); padding-block: calc(env(safe-area-inset-top, 0px) + 32px) 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.fallback-inner { max-width: 680px; margin: 0 auto; display: grid; gap: 36px; }
.fallback section { display: grid; gap: 14px; }
.note { border: 1px dashed var(--md-outline); border-radius: var(--shape-md); padding: 10px 14px; color: var(--md-on-surface-variant); font-size: 13px; line-height: 18px; margin: 0; }
.veil { position: fixed; inset: 0; z-index: 30; background: var(--obsidian); display: grid; place-items: center; transition: opacity .8s; color: var(--md-on-surface-variant); }
.veil.gone { opacity: 0; pointer-events: none; }
#scene { position: fixed; inset: 0; }
#scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }

@media (max-width: 720px) {
  .clock-btn .full { display: none; }
  #sig { width: 150px; height: 58px; }
  .brand .logo { width: 36px; height: 36px; } .brand .logo svg { width: 28px; height: 28px; }
  .sheet { top: auto; left: 0; width: auto; max-height: 64%; border-radius: var(--shape-xl) var(--shape-xl) 0 0; border-left: 0; border-top: 1px solid var(--md-outline-variant); transform: translateY(110%); padding-right: 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
  .sheet .handle { display: block; }
  .sheet-head { padding-top: 4px; }
  .hint { font-size: 10.5px; }
}
@media (prefers-reduced-motion: reduce) { .hotspot .dot::after { animation: none; } .sheet, .veil { transition: none; } }

      h.el.style.transform = `translate(${x}px, ${y}px) translate(-50%, -50%)`; h.el.style.opacity = !introDone ? 0 : (openKey && openKey !== h.key ? .35 : 1); h.el.style.visibility = (x < 0 || x > W || y < 0 || y > H) ? "hidden" : "visible"; });

  }

  const C = c => new THREE.Color(c);
  const PHASE_ENV = {

  };

  let curPhase = null;

    else { glassTop.material.map = SKY[p].back; frontTop.material.map = SKY[p].front; glassTop.material.opacity = 0; frontTop.material.opacity = 0; fading = true; }

  }
  function lerpEnv(dt) {

    sun.color.lerp(T.sun, k); sun.intensity += (T.sunI - sun.intensity) * k; sun.position.lerp(T.pos, k);

    ENV.sconce += (T.sconce - ENV.sconce) * k; ENV.fairy += (T.fairy - ENV.fairy) * k;
    if (ENV.dir.angleTo(T.dir) > 0.0005) { ENV.dir.lerp(T.dir, k).normalize(); beamBuild(ENV.dir); }

  }
  onPhase = p => setPhase(p, false); setPhase(phase, true);

  frame();
})();
